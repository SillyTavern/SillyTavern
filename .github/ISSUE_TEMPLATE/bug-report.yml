name: EasierTavern Bug Report 🐛
type: Bug
description: Report a reproducible EasierTavern problem. Please use English and remove personal data and secrets.
title: '[BUG] <title>'
labels: ['🐛 Bug']
body:
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running EasierTavern?
      options:
        - 🪟 Windows
        - 🐧 Linux
        - 📱 Termux
        - 🐋 Docker
        - 🍎 Mac
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System
      description: >-
        For deployment issues, specify your [distro or OS](https://whatsmyos.com/) and/ or Docker version.
        For client-side issues, include your [browser version](https://www.whatsmybrowser.org/)
      placeholder: e.g. Firefox 101, Manjaro Linux 21.3.0, Docker 20.10.16
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Revision
      description: Which EasierTavern revision are you running?
      placeholder: Paste the Git commit hash from `git rev-parse --short HEAD`
    validations:
      required: true

  - type: textarea
    id: desktop
    attributes:
      label: Desktop Information
      description: Please provide details about your desktop environment.
      placeholder: |
        - Node.js version (if applicable): [run `node --version` in cmd]
        - Generation API [e.g. KoboldAI, OpenAI]
        - Branch
        - Model [e.g. Pygmalion 6b, LLaMa 13b]
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Describe the problem
      description: Please describe exactly what is not working, include the steps to reproduce, actual result and expected result
      placeholder: When doing ABC then DEF, I expect to see XYZ, but I actually see ZYX
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Additional info
      description: Logs? Screenshots? Yes, please.
      placeholder: If the issue happens during build-time, include terminal logs. For run-time errors, include browser logs which you can view in the Dev Tools (F12), under the Console tab. Take care to blank out any personal info.
    validations:
      required: false

  - type: checkboxes
    id: user-check
    attributes:
      label: Please tick the boxes
      description: Before submitting, please ensure that you have completed the following checklist
      options:
        - label: I have explained the issue clearly, and I included all relevant info
          required: true
        - label: I have checked that this [issue hasn't already been raised](https://github.com/YusufErenGoc/EasierTavern/issues?q=is%3Aissue)
          required: true
        - label: I have read the [EasierTavern README](https://github.com/YusufErenGoc/EasierTavern/blob/release/README.md) and relevant [upstream documentation](https://docs.sillytavern.app/)
          required: true
        - label: I reproduced the issue with third-party extensions disabled, or clearly identified any extension involved
          required: true
        - label: I stated whether the problem occurs in simplified mode, advanced mode, or both
          required: true

  - type: markdown
    attributes:
      value: |-
        ## Thanks 🙏
        Thank you for helping improve EasierTavern. If the problem also occurs in unmodified SillyTavern, please say so explicitly.
    validations:
      required: false
