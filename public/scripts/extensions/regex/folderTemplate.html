<div class="regex-folder">
    <div class="folder-header flex-container flexnowrap">
        <span class="drag-handle menu-handle">&#9776;</span>
        <i class="fa-solid fa-folder"></i>
        <strong class="folder-name flexGrow overflow-hidden"></strong>
        <span class="folder-script-count"></span>
        <i class="fa-solid fa-chevron-down folder-toggle-icon"></i>
        <div class="folder-actions flex-container flexnowrap">
            <div class="toggle-folder-scripts-enable menu_button" title="Enable all scripts in folder">
                <i class="fa-solid fa-toggle-off"></i>
            </div>
            <div class="toggle-folder-scripts-disable menu_button" title="Disable all scripts in folder">
                <i class="fa-solid fa-toggle-on"></i>
            </div>
            <div class="edit-folder menu_button" title="Edit folder">
                <i class="fa-solid fa-pencil"></i>
            </div>
            <div class="delete-folder menu_button" title="Delete folder">
                <i class="fa-solid fa-trash"></i>
            </div>
        </div>
    </div>
    <div class="folder-content">
        <div class="folder-description"></div>
        <div class="flex-container regex-script-container flexFlowColumn" no-scripts-text="Drag scripts here" data-i18n="[no-scripts-text]Drag scripts here"></div>
    </div>
</div>
