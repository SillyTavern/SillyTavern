<div class="translation_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="ext_translate_title">Chat Translation</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="translation_auto_mode" class="checkbox_label" data-i18n="ext_translate_auto_mode">Auto-mode</label>
            <select id="translation_auto_mode">
                <option data-i18n="ext_translate_mode_none" value="none">None</option>
                <option data-i18n="ext_translate_mode_responses" value="responses">Translate responses</option>
                <option data-i18n="ext_translate_mode_inputs" value="inputs">Translate inputs</option>
                <option data-i18n="ext_translate_mode_both" value="both">Translate both</option>
            </select>
            <label data-i18n="ext_translate_mode_provider" for="translation_provider">Provider</label>
            <div class="flex-container gap5px flexnowrap marginBot5">
                <select id="translation_provider" name="provider" class="margin0 text_pole flex2">
                    <option value="bing">Bing</option>
                    <option value="deepl">DeepL API</option>
                    <option value="deeplx">DeepLX</option>
                    <option value="google">Google</option>
                    <option value="libre">LibreTranslate</option>
                    <option value="lingva">Lingva</option>
                    <option value="oneringtranslator">OneRingTranslator</option>
                    <option value="translate_openai_compatible">OpenAI Compatible</option>
                    <option value="yandex">Yandex</option>
                </select>
                <select id="deepl_api_endpoint" class="margin0 text_pole flex1" title="DeepL API Endpoint">
                    <option value="free">Free</option>
                    <option value="pro">Pro</option>
                </select>
                <div id="translate_key_button" class="menu_button menu_button_icon margin0 manage-api-keys">
                    <i class="fa-solid fa-key"></i>
                    <span>Key</span>
                </div>
                <div id="translate_url_button" class="menu_button menu_button_icon margin0 manage-api-keys">
                    <i class="fa-solid fa-link"></i>
                    <span>URL</span>
                </div>
            </div>
            <label data-i18n="ext_translate_target_lang" for="translation_target_language">Target Language</label>
            <select id="translation_target_language" name="target_language"></select>
            <div id="translate_openai_compatible_settings">
                <div id="translate_openai_compatible_url">
                    <label data-i18n="ext_translate_openai_compatible_url"
                        for="translate_openai_compatible_url_input">Custom Endpoint Override (Optional)</label>
                    <input id="translate_openai_compatible_url_input" class="text_pole textarea_compact"
                        data-i18n="[placeholder]ext_translate_openai_compatible_url_placeholder"
                        placeholder="The URL defined for chat completions will be used by default">
                </div>
                <div id="translate_openai_compatible_model">
                    <label data-i18n="ext_translate_openai_compatible_model" for="translate_openai_compatible_model">Model
                        Override (Optional)</label>
                    <input id="translate_openai_compatible_model_input" class="text_pole textarea_compact"
                        data-i18n="[placeholder]ext_translate_openai_compatible_model_placeholder"
                        placeholder="The model defined for chat completions will be used by default">
                </div>
                <div id="translate_openai_compatible_system_prompt">
                    <label data-i18n="ext_translate_openai_compatible_system_prompt"
                        for="translate_openai_compatible_system_prompt_textarea">System Prompt</label>
                    <textarea id="translate_openai_compatible_system_prompt_textarea" class="text_pole textarea_compact"
                        rows="3" data-i18n="[placeholder]ext_translate_openai_compatible_system_prompt_placeholder"
                        placeholder='You can use placeholders: {{messageAuthorPersonality}} to fill persona description, {{translateFromLang}} and {{translateToLang}} for selected language pair and {{messageToTranslate}} for message being translated'></textarea>
                </div>
                <div id="translate_openai_compatible_user_prompt">
                    <label data-i18n="ext_translate_openai_compatible_user_prompt"
                        for="translate_openai_compatible_user_prompt_textarea">User Prompt</label>
                    <textarea id="translate_openai_compatible_user_prompt_textarea" class="text_pole textarea_compact"
                        rows="3" data-i18n="[placeholder]ext_translate_openai_compatible_user_prompt_placeholder"
                        placeholder='You can use placeholders: {{messageAuthorPersonality}} to fill persona description, {{translateFromLang}} and {{translateToLang}} for selected language pair and {{messageToTranslate}} for message being translated'></textarea>
                </div>
                <div id="translate_openai_compatible_block_size" class="range-block">
                    <div id="translate_openai_compatible_block_size_title" class="range-block-title"
                        data-i18n="ext_translate_openai_compatible_block_size">
                        Translate block size (characters)
                    </div>
                    <div class="range-block-range-and-counter">
                        <div class="range-block-range">
                            <input id="translate_openai_compatible_block_size_slider" type="range" name="volume" min="128"
                                max="100000" step="1">
                        </div>
                        <div class="range-block-counter" data-randomization-disabled="true">
                            <input id="translate_openai_compatible_block_size_slider_counter" type="number" min="128"
                                max="100000" step="1" data-for="translate_openai_compatible_block_size_slider">
                        </div>
                    </div>
                </div>
            </div>
            <div id="translation_clear" class="menu_button">
                <i class="fa-solid fa-trash-can"></i>
                <span data-i18n="ext_translate_clear">Clear Translations</span>
            </div>
        </div>
    </div>
</div>
