<div id="marketplace_wallet_ui">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="Marketplace & Wallet">Marketplace &amp; Wallet</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="marketplace-wallet-layout">
                <section class="marketplace-wallet-balance" aria-label="Wallet balance">
                    <div class="marketplace-wallet-balance-main">
                        <i class="fa-solid fa-coins" aria-hidden="true"></i>
                        <span id="marketplace_wallet_total">0</span>
                    </div>
                    <div class="marketplace-wallet-buckets">
                        <span><b data-marketplace-wallet-bucket="bonus">0</b> bonus</span>
                        <span><b data-marketplace-wallet-bucket="paid">0</b> paid</span>
                        <span><b data-marketplace-wallet-bucket="earnings">0</b> earnings</span>
                    </div>
                    <button id="marketplace_wallet_refresh" class="menu_button menu_button_icon" type="button" title="Refresh marketplace" data-i18n="[title]Refresh marketplace">
                        <i class="fa-solid fa-rotate" aria-hidden="true"></i>
                    </button>
                </section>

                <section class="marketplace-wallet-creator" aria-label="Creator center">
                    <div class="marketplace-wallet-creator-header">
                        <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                        <b data-i18n="Creator Center">Creator Center</b>
                    </div>
                    <div class="marketplace-wallet-creator-stats">
                        <span><b id="marketplace_wallet_creator_assets">0</b> assets</span>
                        <span><b id="marketplace_wallet_creator_listed">0</b> listed</span>
                        <span><b id="marketplace_wallet_creator_sales">0</b> claims</span>
                        <span><b id="marketplace_wallet_creator_earnings">0</b> earned</span>
                    </div>
                    <div id="marketplace_wallet_creator_assets_list" class="marketplace-wallet-creator-assets" aria-live="polite"></div>
                </section>

                <section class="marketplace-wallet-library" aria-label="My library">
                    <div class="marketplace-wallet-library-header">
                        <i class="fa-solid fa-bookmark" aria-hidden="true"></i>
                        <b data-i18n="My Library">My Library</b>
                    </div>
                    <div id="marketplace_wallet_library_items" class="marketplace-wallet-library-items" aria-live="polite"></div>
                </section>

                <section class="marketplace-wallet-ledger" aria-label="Wallet activity">
                    <div class="marketplace-wallet-ledger-header">
                        <i class="fa-solid fa-receipt" aria-hidden="true"></i>
                        <b data-i18n="Wallet Activity">Wallet Activity</b>
                    </div>
                    <div id="marketplace_wallet_ledger_items" class="marketplace-wallet-ledger-items" aria-live="polite"></div>
                </section>

                <section class="marketplace-wallet-controls" aria-label="Marketplace filters">
                    <select id="marketplace_wallet_type_filter" class="text_pole" aria-label="Asset type">
                        <option value="" data-i18n="All types">All types</option>
                        <option value="character_card" data-i18n="Character cards">Character cards</option>
                        <option value="world_book" data-i18n="World books">World books</option>
                    </select>
                    <select id="marketplace_wallet_price_filter" class="text_pole" aria-label="Price">
                        <option value="" data-i18n="Any price">Any price</option>
                        <option value="free" data-i18n="Free">Free</option>
                        <option value="fixed_price" data-i18n="Paid">Paid</option>
                    </select>
                    <select id="marketplace_wallet_access_filter" class="text_pole" aria-label="Access">
                        <option value="" data-i18n="All access">All access</option>
                        <option value="available" data-i18n="Available">Available</option>
                        <option value="library" data-i18n="In library">In library</option>
                        <option value="mine" data-i18n="My uploads">My uploads</option>
                    </select>
                    <select id="marketplace_wallet_sort" class="text_pole" aria-label="Sort">
                        <option value="recent" data-i18n="Recent">Recent</option>
                        <option value="popular" data-i18n="Popular">Popular</option>
                        <option value="price_asc" data-i18n="Price: Low">Price: Low</option>
                        <option value="price_desc" data-i18n="Price: High">Price: High</option>
                    </select>
                    <input id="marketplace_wallet_search" class="text_pole" type="search" placeholder="Search" data-i18n="[placeholder]Search" aria-label="Search marketplace">
                    <button id="marketplace_wallet_clear_filters" class="menu_button menu_button_icon" type="button" hidden>
                        <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i>
                        <span data-i18n="Clear filters">Clear filters</span>
                    </button>
                </section>

                <div id="marketplace_wallet_assets" class="marketplace-wallet-assets" aria-live="polite"></div>

                <section id="marketplace_wallet_admin" class="marketplace-wallet-admin" aria-label="Marketplace admin tools" hidden>
                    <div class="marketplace-wallet-admin-header">
                        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                        <b data-i18n="Admin Tools">Admin Tools</b>
                    </div>
                    <div class="marketplace-wallet-admin-grid">
                        <div class="marketplace-wallet-grant">
                            <label for="marketplace_wallet_grant_handle" data-i18n="User handle">User handle</label>
                            <input id="marketplace_wallet_grant_handle" class="text_pole" placeholder="default-user" aria-label="User handle">
                            <label for="marketplace_wallet_grant_amount" data-i18n="Amount">Amount</label>
                            <input id="marketplace_wallet_grant_amount" class="text_pole" type="number" min="1" step="1" value="100" aria-label="Grant amount">
                            <label for="marketplace_wallet_grant_bucket" data-i18n="Bucket">Bucket</label>
                            <select id="marketplace_wallet_grant_bucket" class="text_pole" aria-label="Grant bucket">
                                <option value="bonus">bonus</option>
                                <option value="paid">paid</option>
                                <option value="earnings">earnings</option>
                            </select>
                            <label for="marketplace_wallet_grant_reason" data-i18n="Reason">Reason</label>
                            <input id="marketplace_wallet_grant_reason" class="text_pole" value="Admin grant" aria-label="Grant reason">
                            <button id="marketplace_wallet_grant_submit" class="menu_button menu_button_icon" type="button">
                                <i class="fa-solid fa-hand-holding-dollar" aria-hidden="true"></i>
                                <span data-i18n="Grant Coins">Grant Coins</span>
                            </button>
                        </div>
                        <div class="marketplace-wallet-review">
                            <div class="marketplace-wallet-review-title">
                                <i class="fa-solid fa-clipboard-check" aria-hidden="true"></i>
                                <b data-i18n="Review Queue">Review Queue</b>
                            </div>
                            <div id="marketplace_wallet_review_queue" class="marketplace-wallet-review-queue" aria-live="polite"></div>
                            <div class="marketplace-wallet-review-title marketplace-wallet-report-title">
                                <i class="fa-solid fa-flag" aria-hidden="true"></i>
                                <b data-i18n="Report Queue">Report Queue</b>
                            </div>
                            <div id="marketplace_wallet_report_queue" class="marketplace-wallet-review-queue marketplace-wallet-report-queue" aria-live="polite"></div>
                        </div>
                    </div>
                </section>

                <section class="marketplace-wallet-upload" aria-label="Upload market asset">
                    <div class="marketplace-wallet-upload-header">
                        <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                        <b data-i18n="Upload to Marketplace">Upload to Marketplace</b>
                    </div>
                    <div id="marketplace_wallet_upload_status" class="marketplace-wallet-upload-status" hidden>
                        <span id="marketplace_wallet_upload_mode"></span>
                        <button id="marketplace_wallet_upload_cancel" class="menu_button menu_button_icon" type="button">
                            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                            <span data-i18n="Cancel">Cancel</span>
                        </button>
                    </div>
                    <div class="marketplace-wallet-upload-grid">
                        <select id="marketplace_wallet_upload_type" class="text_pole" aria-label="Upload type">
                            <option value="character_card" data-i18n="Character card">Character card</option>
                            <option value="world_book" data-i18n="World book">World book</option>
                        </select>
                        <input id="marketplace_wallet_upload_title" class="text_pole" maxlength="160" placeholder="Title" data-i18n="[placeholder]Title" aria-label="Title">
                        <select id="marketplace_wallet_upload_price_type" class="text_pole" aria-label="Price type">
                            <option value="free" data-i18n="Free">Free</option>
                            <option value="fixed_price" data-i18n="Fixed price">Fixed price</option>
                        </select>
                        <input id="marketplace_wallet_upload_price" class="text_pole" type="number" min="0" step="1" value="0" aria-label="Price coins">
                    </div>
                    <input id="marketplace_wallet_upload_summary" class="text_pole" maxlength="280" placeholder="Summary" data-i18n="[placeholder]Summary" aria-label="Summary">
                    <input id="marketplace_wallet_upload_tags" class="text_pole" maxlength="900" placeholder="Tags, comma separated" data-i18n="[placeholder]Tags, comma separated" aria-label="Tags">
                    <div class="marketplace-wallet-file-row">
                        <input id="marketplace_wallet_upload_file" type="file" accept=".json,application/json">
                        <label for="marketplace_wallet_upload_file" class="menu_button menu_button_icon">
                            <i class="fa-solid fa-file-import" aria-hidden="true"></i>
                            <span data-i18n="Load JSON">Load JSON</span>
                        </label>
                    </div>
                    <textarea id="marketplace_wallet_upload_payload" class="text_pole textarea_compact monospace" rows="8" placeholder="{ }" aria-label="Payload JSON"></textarea>
                    <div class="marketplace-wallet-upload-actions">
                        <button class="menu_button menu_button_icon" type="button" data-marketplace-wallet-upload="draft">
                            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                            <span data-i18n="Save Draft">Save Draft</span>
                        </button>
                        <button class="menu_button menu_button_icon" type="button" data-marketplace-wallet-upload="review">
                            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                            <span data-i18n="Submit">Submit</span>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>
