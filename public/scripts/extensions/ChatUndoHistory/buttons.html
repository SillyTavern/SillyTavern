<div id=undo_buttons style="display: flex;">
    <a id="option_undo_undo" title="Undo the last chat change." data-i18n="[title]Undo the last chat change."
        class="interactable flex" tabindex="0" target="_blank" rel="noopener">
        <i class="fa-lg fa-solid fa-rotate-left"></i>
        <span data-i18n="Undo">Undo</span>
    </a><a id="option_undo_redo" title="Redo the last chat change." data-i18n="[title]Redo the last chat change."
        class="interactable flex" tabindex="0" target="_blank" rel="noopener">
        <i class="fa-lg fa-solid fa-rotate-right"></i>
        <span data-i18n="Redo">Redo</span>
    </a>
</div>
<div id='undo_save_options' style="display: flex;">
    <a id="option_undo_save" title="Save the current chat to undo history.." data-i18n="[title]Save the current chat to undo history.."
        class="interactable flex" tabindex="0" target="_blank" rel="noopener">
        <i class="fa-lg fa-solid fa-floppy-disk"></i>
        <span data-i18n="Save">Save</span>
    </a><a id="option_undo_discard" title="Discard all chats from the undo history." data-i18n="[title]Discard all chats from the undo history."
        class="interactable flex" tabindex="0" target="_blank" rel="noopener">
        <i class="fa-lg fa-solid fa-trash-can"></i>
        <span data-i18n="Discard all saves.">Discard all saves.</span>
    </a>
</div>
<hr>
