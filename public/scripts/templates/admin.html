<div class="adminTabs wide100p">
    <nav class="adminNav flex-container alignItemsCenter justifyCenter" role="tablist" aria-label="User Management">
        <button type="button" class="manageUsersButton menu_button menu_button_icon" data-target-tab="usersList" role="tab" aria-selected="true" id="user-list-tab" aria-controls="usersList">
            <h4 data-i18n="Manager Users">Manage Users</h4>
        </button>
        <button type="button" class="newUserButton menu_button menu_button_icon" data-target-tab="registerNewUserBlock" role="tab" tabindex="-1" aria-selected="false" id="new-user-tab" aria-controls="registerNewUserBlock">
            <h4 data-i18n="New User">New User</h4>
        </button>
    </nav>
    <div class="userAccountTemplate template_element">
        <div class="flex-container userAccount alignItemsCenter flexGap10">
            <div class="flex-container flexFlowColumn alignItemsCenter flexNoGap">
                <div class="avatar" title="If a custom avatar is not set, the user's default persona image will be displayed." data-i18n="[title]If a custom avatar is not set, the user's default persona image will be displayed.">
                    <img src="img/ai4.png" alt="avatar">
                </div>
                <div class="flex-container alignItemsCenter">
                    <div class="userAvatarChange right_menu_button" title="Set a custom avatar." data-i18n="[title]Set a custom avatar." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-image"></i>
                    </div>
                    <div class="userAvatarRemove right_menu_button" title="Remove a custom avatar." data-i18n="[title]Remove a custom avatar." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-trash"></i>
                    </div>
                </div>
                <form>
                    <input type="file" class="avatarUpload" accept="image/*" hidden>
                </form>
            </div>
            <div class="flex1 flex-container flexFlowColumn flexNoGap justifyLeft">
                <div class="flex-container flexGap10 alignItemsCenter">
                    <i class="hasPassword fa-solid fa-lock" title="This account is password protected." data-i18n="[title]This account is password protected."></i>
                    <i class="noPassword fa-solid fa-lock-open" title="This account is not password protected." data-i18n="[title]This account is not password protected."></i>
                    <h3 class="userName margin0" data-i18n="User Name">User Name</h3>
                    <small class="userHandle">&nbsp;</small>
                </div>
                <div class="flex-container flexFlowColumn flexNoGap">
                    <span>
                        <span data-i18n="Role:">Role:</span>
                        <span class="userRole"></span>
                    </span>
                    <span>
                        <span data-i18n="Status:">Status:</span>
                        <span class="userStatus">&nbsp;</span>
                    </span>
                    <span>
                        <span data-i18n="Created:">Created:</span>
                        <span class="userCreated">&nbsp;</span>
                    </span>
                </div>
            </div>
            <div class="flex-container flexFlowColumn">
                <div class="flex-container">
                    <div class="userChangeNameButton menu_button" title="Change user display name." data-i18n="[title]Change user display name." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-pencil"></i>
                    </div>
                    <div class="userEnableButton menu_button" title="Enable user account." data-i18n="[title]Enable user account." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-check"></i>
                    </div>
                    <div class="userDisableButton menu_button" title="Disable user account." data-i18n="[title]Disable user account." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-ban"></i>
                    </div>
                    <div class="userPromoteButton menu_button" title="Promote user to admin." data-i18n="[title]Promote user to admin." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-arrow-up"></i>
                    </div>
                    <div class="userDemoteButton menu_button" title="Demote user to regular user." data-i18n="[title]Demote user to regular user." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-arrow-down"></i>
                    </div>
                </div>
                <div class="flex-container">
                    <div class="userBackupButton menu_button menu_button_icon" title="Download a backup of user data." data-i18n="[title]Download a backup of user data." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-download"></i>
                    </div>
                    <div class="userChangePasswordButton menu_button" title="Change user password." data-i18n="[title]Change user password." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-key"></i>
                    </div>
                    <div class="userDelete menu_button warning" title="Delete user account." data-i18n="[title]Delete user account." role="button" tabindex="0">
                        <i class="fa-fw fa-solid fa-trash"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="usersList" class="navTab usersList flex-container flexFlowColumn" role="tabpanel" tabindex="0" aria-labelledby="user-list-tab">
    </div>
    <div id="registerNewUserBlock" class="navTab registerNewUserBlock" style="display: none;" role="tabpanel" tabindex="0" aria-labelledby="new-user-tab">
        <form class="flex-container flexFlowColumn flexGap10 userCreateForm" action="javascript:void(0);">
            <div class="flex-container flexNoGap">
                <label for="createUserDisplayName" data-i18n="Display Name:">Display Name:</label>
                <span class="warning">*</span>
                <input id="createUserDisplayName" name="_name" class="createUserDisplayName text_pole" type="text" placeholder="e.g. John Snow" autocomplete="username" data-i18n="[placeholder]e.g. John Snow">
            </div>
            <div class="flex-container flexNoGap">
                <label for="createUserHandle" data-i18n="User Handle:">User Handle:</label>
                <span class="warning">*</span>
                <input id="createUserHandle" name="handle" class="createUserHandle text_pole" placeholder="john-snow (letters, numbers, dashes only)" type="text" pattern="[a-z0-9-]+" data-i18n="[placeholder]john-snow (letters, numbers, dashes only)">
            </div>
            <div class="flex-container flexNoGap">
                <label for="createUserPassword" data-i18n="Password:">Password:</label>
                <input id="createUserPassword" name="password" class="createUserPassword text_pole" type="password" placeholder="Leave blank for no password" autocomplete="new-password" data-i18n="[placeholder]Leave blank for no password">
            </div>
            <div class="flex-container flexNoGap">
                <label for="createUserConfirmPassword" data-i18n="Confirm Password:">Confirm Password:</label>
                <input id="createUserConfirmPassword" name="confirm" class="createUserConfirmPassword text_pole" type="password" placeholder="Leave blank for no password" autocomplete="new-password" data-i18n="[placeholder]Leave blank for no password">
            </div>
            <span data-i18n="This will create a new subfolder...">
                This will create a new subfolder in the /data/ directory with the user's handle as the folder name.
            </span>
            <div class="flex-container justifyCenter">
                <button type="submit" class="menu_button menu_button_icon newUserRegisterFinalizeButton">
                    <i class="fa-fw fa-solid fa-user-plus"></i>
                    <span data-i18n="Create">Create</span>
                </button>
            </div>
        </form>
    </div>
</div>
