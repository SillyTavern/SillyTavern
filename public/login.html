<!DOCTYPE html>
<html lang="en">
    <head>
        <base href="/" />
        <meta charset="utf-8" />
        <meta
            content="width=device-width, viewport-fit=cover, initial-scale=1, interactive-widget=resizes-content"
            name="viewport"
        />
        <meta content="yes" name="apple-mobile-web-app-capable" />
        <meta content="yes" name="mobile-web-app-capable" />
        <meta name="darkreader-lock" />
        <meta content="noindex, nofollow" name="robots" />
        <style>
            /* Put critical CSS here. The rest should go in stylesheets. */
            body {
                background-color: rgb(36, 36, 37);
            }
        </style>
        <link as="style" href="style.css" rel="preload" />
        <link
            href="img/apple-icon-57x57.png"
            rel="apple-touch-icon"
            sizes="57x57"
        />
        <link
            href="img/apple-icon-72x72.png"
            rel="apple-touch-icon"
            sizes="72x72"
        />
        <link
            href="img/apple-icon-114x114.png"
            rel="apple-touch-icon"
            sizes="114x114"
        />
        <link
            href="img/apple-icon-144x144.png"
            rel="apple-touch-icon"
            sizes="144x144"
        />
        <link href="favicon.ico" rel="icon" type="image/x-icon" />
        <link href="style.css" rel="stylesheet" type="text/css" />
        <link href="css/st-tailwind.css" rel="stylesheet" type="text/css" />
        <link href="css/login.css" rel="stylesheet" type="text/css" />
        <link
            crossorigin="use-credentials"
            href="manifest.json"
            rel="manifest"
        />
        <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet" />
        <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet" />
        <!-- fontawesome webfonts-->
        <link href="css/fontawesome.min.css" rel="stylesheet" />
        <link href="css/solid.min.css" rel="stylesheet" />
        <link href="css/user.css" rel="stylesheet" />
        <title>SillyTavern</title>
    </head>
    <body class="login">
        <main id="shadow_popup" style="opacity: 0">
            <div
                aria-labelledby="dialog-title"
                aria-modal="true"
                id="dialogue_popup"
                role="dialog"
            >
                <div id="dialogue_popup_holder">
                    <div id="dialogue_popup_text">
                        <div
                            class="flex-container flexFlowColumn alignItemsCenter"
                            id="userSelectBlock"
                        >
                            <h2 class="flex-container" id="logoBlock">
                                <img
                                    alt="SillyTavern"
                                    class="logo"
                                    src="img/logo.png"
                                />
                                <span data-i18n="" id="dialog-title"
                                    >Welcome to SillyTavern</span
                                >
                            </h2>
                            <h3 data-i18n="" id="normalLoginPrompt">
                                Select an Account
                            </h3>
                            <h3 data-i18n="" id="discreetLoginPrompt">
                                Enter Login Details
                            </h3>
                            <form class="wide100p" id="userListBlock">
                                <div
                                    class="flex-container justifySpaceEvenly"
                                    id="userList"
                                ></div>
                                <div
                                    class="flex-container flexFlowColumn alignItemsCenter"
                                    id="handleEntryBlock"
                                    style="display: none"
                                >
                                    <input
                                        autocomplete="username"
                                        class="text_pole"
                                        data-i18n="Enter user handle"
                                        id="userHandle"
                                        placeholder="Enter user handle"
                                        type="text"
                                    />
                                </div>
                                <div
                                    class="flex-container flexFlowColumn alignItemsCenter"
                                    id="passwordEntryBlock"
                                    style="display: none"
                                >
                                    <input
                                        autocomplete="current-password"
                                        class="text_pole"
                                        data-i18n="Enter password"
                                        id="userPassword"
                                        placeholder="Enter password"
                                        type="password"
                                    />
                                    <a
                                        data-i18n=""
                                        href="#"
                                        id="recoverPassword"
                                        onclick="return false;"
                                        >Forgot password?</a
                                    >
                                    <div class="flex-container">
                                        <div
                                            class="menu_button"
                                            data-i18n=""
                                            id="loginButton"
                                            role="button"
                                            tabindex="0"
                                        >
                                            Login
                                        </div>
                                    </div>
                                </div>
                                <div
                                    class="flex-container flexFlowColumn alignItemsCenter"
                                    id="passwordRecoveryBlock"
                                    style="display: none"
                                >
                                    <div data-i18n="" id="recoverMessage">
                                        Recovery code has been posted to the
                                        server console.
                                    </div>
                                    <input
                                        class="text_pole"
                                        data-i18n="Enter recovery code"
                                        id="recoveryCode"
                                        placeholder="Enter recovery code"
                                        type="text"
                                    />
                                    <input
                                        autocomplete="new-password"
                                        class="text_pole"
                                        data-i18n="Enter new password"
                                        id="newPassword"
                                        placeholder="Enter new password"
                                        type="password"
                                    />
                                    <div class="flex-container flexGap10">
                                        <div
                                            class="menu_button"
                                            data-i18n=""
                                            id="sendRecovery"
                                            role="button"
                                            tabindex="0"
                                        >
                                            Send
                                        </div>
                                        <div
                                            class="menu_button"
                                            data-i18n=""
                                            id="cancelRecovery"
                                            role="button"
                                            tabindex="0"
                                        >
                                            Cancel
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div
                                aria-live="polite"
                                class="neutral_warning"
                                id="errorMessage"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="lib/jquery-3.5.1.min.js"></script>
        <script src="scripts/login.js"></script>
    </body>
</html>
